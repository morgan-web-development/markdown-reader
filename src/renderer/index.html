<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Reader</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-chrome">
        <div class="chrome-left">
          <img class="chrome-logo" src="./assets/logo.png" alt="" width="28" height="28" />
          <p class="chrome-brand">Markdown Reader</p>
          <p id="file-name" class="file-name is-hidden" aria-hidden="true"></p>
        </div>
        <div class="chrome-actions">
          <button
            type="button"
            id="theme-toggle"
            class="btn btn-icon theme-toggle"
            aria-label="Toggle color theme"
            title="Toggle light / dark"
          >
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M21 14.3A8.5 8.5 0 0 1 9.7 3 7 7 0 1 0 21 14.3Z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.75" />
              <path
                d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button type="button" id="open-again" class="btn btn-secondary is-hidden" aria-hidden="true">
            Open
          </button>
        </div>
      </header>

      <main id="empty-state" class="empty-state">
        <div class="empty-panel">
          <img class="empty-logo" src="./assets/logo.png" alt="" width="72" height="72" />
          <p class="brand">Markdown Reader</p>
          <h1 class="empty-title">Read Markdown, clearly</h1>
          <p class="empty-copy">
            Open a file from your computer and view it in a calm, readable layout.
          </p>
          <button type="button" id="open-file" class="btn btn-primary">
            Open Markdown File
          </button>
          <p class="empty-hint">Or drag and drop a .md file here</p>
        </div>
      </main>

      <article id="article" class="article is-hidden" aria-hidden="true"></article>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
